    <script>
      /* Prudle host allowlist + save-shortcut deterrent. Server-side Worker checks are authoritative. */
      (function(){
        "use strict";
        const LOGIN = "https://www.prudle-education.com/log-in-out";
        const allowed = new Set(["www.prudle-education.com", "prudle-education.com", "abbassaboali-alt.github.io"]);
        window.addEventListener("keydown", function(e){
          if((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === "s") e.preventDefault();
        }, {capture: true});
        const isDev = location.hostname === "localhost" || location.hostname === "127.0.0.1" || location.hostname.includes("run.app") || location.hostname.includes("ais-");
        if(!isDev && (location.protocol !== "https:" || !allowed.has(location.hostname.toLowerCase()))){
          window.stop();
          try{ document.documentElement.innerHTML = ""; }catch(e){}
          location.replace(LOGIN);
          return;
        }
        if(location.hostname.toLowerCase() === "prudle-education.com"){
          window.stop();
          location.replace("https://www.prudle-education.com" + location.pathname + location.search + location.hash);
        }
      })();
